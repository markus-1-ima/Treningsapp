<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treningsbok</title>
<meta name="description" content="Ukeplan, økter, fremgang og hjemmetrening.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e141b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treningsbok">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>
<section id="auth" class="auth" hidden>
  <div class="auth-box">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Treningsbok</h1></div>
    <p id="auth-load" class="sub">Laster …</p>
    <button id="auth-retry" class="btn" type="button" hidden>Prøv igjen</button>
    <div id="auth-card" class="panel auth-card" hidden>
      <h2 id="auth-title">Logg inn</h2>
      <form id="auth-form" novalidate>
        <label for="auth-email">E-post</label>
        <input id="auth-email" class="inp" type="email" autocomplete="email" inputmode="email">
        <label for="auth-pass">Passord</label>
        <input id="auth-pass" class="inp" type="password" autocomplete="current-password">
        <p id="auth-msg" class="msg" role="alert"></p>
        <button id="auth-submit" class="btn btn-primary" type="submit">Logg inn</button>
      </form>
      <div class="auth-links">
        <button id="auth-toggle" class="linkbtn" type="button">Ny her? Opprett konto</button>
        <button id="auth-reset" class="linkbtn" type="button">Glemt passord?</button>
      </div>
    </div>
  </div>
</section>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Treningsbok</h1></div>
    <div class="top-right">
      <select id="theme" class="theme-sel" aria-label="Utseende">
        <option value="auto">Automatisk</option>
        <option value="light">Lys</option>
        <option value="dark">Mørk</option>
      </select>
      <span id="sync" class="sync" role="status">Henter …</span>
      <button id="logout" class="btn btn-sm" hidden>Logg ut</button>
    </div>
  </header>
  <nav class="nav" aria-label="Hovedmeny">
    <a href="#uke" data-v="uke"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Uke</span></a>
    <a href="#okt" data-v="okt"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2h5"/></svg><span>Økt</span></a>
    <a href="#programmer" data-v="programmer"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg><span class="long">Programmer</span><span class="short">Program</span></a>
    <a href="#hjemme" data-v="hjemme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Hjemme</span></a>
    <a href="#fremgang" data-v="fremgang"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-5 4 3.5L20 8"/><path d="M14.5 8H20v5.5"/></svg><span>Fremgang</span></a>
    <a href="#mer" data-v="mer"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span>Mer</span></a>
  </nav>
  <main id="app"></main>
</div>

<div id="restbar" hidden>
  <div class="rest-in">
    <div class="rest-read"><span class="rest-lab">Hvile</span><span id="rest-time" class="rest-time tnum">1:30</span></div>
    <div class="rest-chips" role="group" aria-label="Hviletid">
      <button class="chip" data-act="rest" data-s="60" aria-pressed="false">1:00</button>
      <button class="chip" data-act="rest" data-s="90" aria-pressed="false">1:30</button>
      <button class="chip" data-act="rest" data-s="120" aria-pressed="false">2:00</button>
      <button class="chip" data-act="rest-stop">Stopp</button>
    </div>
  </div>
</div>

<script src="firebase-config.js?v=2"></script>
<script src="anim.js?v=7"></script>
<script src="mer.js?v=2"></script>
<script src="app.js?v=14"></script>
</body>
</html>
